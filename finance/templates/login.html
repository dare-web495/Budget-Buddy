{% extends 'layout.html' %}

{% block title %}Login | Budget Buddy{% endblock %}

{% block body %}
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 75vh;">
        <div class="card p-4 shadow border-0" style="max-width: 420px; width: 100%;">
            
            <script>
                // Displays a confirmation message if the user just deleted their account
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get('deleted') === 'true') {
                    document.write('<div class="alert alert-success border-0 shadow-sm small" role="alert"><i class="bi bi-check-circle-fill me-2"></i>Your profile has been permanently erased.</div>');
                }
            </script>

            <h2 class="fw-bold text-dark mb-1 tracking-tight">Welcome Back</h2>
            <p class="text-muted small mb-4">Sign in to monitor your Kenyan Shilling targets.</p>

            <form method="POST" action="{% url 'login' %}">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary" for="id_username">Username</label>
                    <input type="text" name="username" id="id_username" class="form-control shadow-sm" required autofocus>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-bold text-secondary" for="id_password">Password</label>
                    <input type="password" name="password" id="id_password" class="form-control shadow-sm" required>
                </div>

                <button type="submit" class="btn btn-success w-100 fw-bold shadow-sm">login</button>
            </form>

            <div class="text-center mt-4 small text-muted">
                New to the platform? <a href="{% url 'register' %}" class="text-success fw-bold text-decoration-none">Create Account</a>
            </div>
        </div>
    </div>
{% endblock %}
